name: Python CI

# Run CI when a pull request targets main
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  test:
    name: Validate Program and Test Cases
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the pull request code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      # Step 4: Check Python syntax
      - name: Check Python syntax
        run: python -m compileall -q .

      # Step 5: Verify test files exist
      - name: Check test files
        run: |
          if ! find . -type f -name "test_*.py" \
            -not -path "./.git/*" -print -quit | grep -q .; then
            echo "ERROR: No test files found!"
            exit 1
          fi

      # Step 6: Run automated tests
      - name: Run pytest
        run: python -m pytest -v
